          - heading "Recall@K" [level=3] [ref=e291]
          - generic [ref=e292]:
            - paragraph [ref=e293]: "Definition: Fraction of ground-truth evidence found in the top K retrieved results."
            - paragraph [ref=e294]: "Range: [0.0, 1.0] — higher is better"
            - paragraph [ref=e295]: "Example: If 2 of 5 ground-truth anchors appear in top 5 results, Recall@5 = 0.4"
        - generic [ref=e296]:
          - heading "Precision@K" [level=3] [ref=e297]
          - generic [ref=e298]:
            - paragraph [ref=e299]: "Definition: Fraction of top K results that match ground-truth evidence."
            - paragraph [ref=e300]: "Range: [0.0, 1.0] — higher is better"
            - paragraph [ref=e301]: "Example: If 3 of 5 top results are relevant, Precision@5 = 0.6"
        - generic [ref=e302]:
          - heading "Hit@K" [level=3] [ref=e303]
          - generic [ref=e304]:
            - paragraph [ref=e305]: "Definition: Binary indicator: 1 if at least one ground-truth anchor appears in top K results."
            - paragraph [ref=e306]: "Range: [0, 1] — whether evidence was found"
            - paragraph [ref=e307]: "Use case: Quick check for presence of relevant evidence at given cutoff."
        - generic [ref=e308]:
          - heading "IoU (Intersection over Union)" [level=3] [ref=e309]
          - generic [ref=e310]:
            - paragraph [ref=e311]: "Definition: Character-span overlap ratio between retrieved text and ground-truth span."
            - paragraph [ref=e312]: "Range: [0.0, 1.0] — 1.0 = exact match"
            - paragraph [ref=e313]: "Example: If retrieved text overlaps 80% of the ground-truth character span, IoU = 0.8"
