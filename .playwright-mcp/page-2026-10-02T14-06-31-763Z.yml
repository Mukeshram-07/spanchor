    - generic [ref=f1e66]:
      - heading "What SPANCHOR does" [level=2] [ref=f1e67]
      - paragraph [ref=f1e68]:
        - text: "SPANCHOR evaluates retrieved evidence against source-anchored ground truth and compares retrieval runs to detect query-level regressions. It gives you a deterministic, math-based answer to the question:"
        - emphasis [ref=f1e69]: "\"Is my retrieval pipeline still finding the right content?\""
      - generic [ref=f1e70]:
        - generic [ref=f1e71]:
          - heading "Source Anchors" [level=3] [ref=f1e72]
          - paragraph [ref=f1e73]: Ground truth tied directly to character offsets in source documents — stable across chunking changes.
        - generic [ref=f1e74]:
          - heading "Deterministic Metrics" [level=3] [ref=f1e75]
          - paragraph [ref=f1e76]: Recall@K, Precision@K, Hit@K, and IoU computed with exact character overlap math. No LLM judges.
        - generic [ref=f1e77]:
          - heading "Baseline vs Candidate" [level=3] [ref=f1e78]
          - paragraph [ref=f1e79]: Compare two retriever runs to measure which queries improved, regressed, or stayed the same.
        - generic [ref=f1e80]:
          - heading "CI Integration" [level=3] [ref=f1e81]
          - paragraph [ref=f1e82]: Automated exit codes and summary reports for pytest and GitHub Actions pipelines.
    - generic [ref=f1e84]:
      - heading "The problem" [level=2] [ref=f1e85]
      - paragraph [ref=f1e86]: "RAG pipeline changes can silently alter which evidence is retrieved. Any of the following can change retrieval behavior without obvious indication:"
      - list [ref=f1e87]:
        - listitem [ref=f1e88]: Chunk size or overlap
        - listitem [ref=f1e90]: Embedding model version
        - listitem [ref=f1e92]: Retriever algorithm
        - listitem [ref=f1e94]: Vector database upgrade
        - listitem [ref=f1e96]: Reranking strategy
        - listitem [ref=f1e98]: Document updates
      - paragraph [ref=f1e100]: Without regression tests, you only discover these changes when your application produces wrong answers. SPANCHOR makes retrieval changes testable before they reach production.
