      - paragraph [ref=f12e21]: Where source-anchored retrieval evaluation fits inside a RAG pipeline.
      - paragraph [ref=f12e22]: SPANCHOR sits between retrieval output and evaluation decisions. It maps retrieved evidence back to canonical source spans, measures retrieval quality, and compares baseline and candidate runs for regression detection.
