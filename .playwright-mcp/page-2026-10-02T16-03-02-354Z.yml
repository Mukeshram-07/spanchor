      - paragraph [ref=e41]: Source-anchored regression testing for RAG retrieval pipelines.
      - paragraph [ref=e42]: SPANCHOR evaluates whether your retrieval pipeline consistently finds the right source evidence — and detects when pipeline changes cause regressions.
