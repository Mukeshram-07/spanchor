    - generic [ref=e64]:
      - heading "What SPANCHOR does" [level=2] [ref=e65]
      - paragraph [ref=e66]:
        - text: "SPANCHOR evaluates retrieved evidence against source-anchored ground truth and compares retrieval runs to detect query-level regressions. It gives you a deterministic, math-based answer to the question:"
        - emphasis [ref=e67]: "\"Is my retrieval pipeline still finding the right content?\""
      - generic [ref=e68]:
        - generic [ref=e69]:
          - heading "Source Anchors" [level=3] [ref=e70]
          - paragraph [ref=e71]: Ground truth tied directly to character offsets in source documents — stable across chunking changes.
        - generic [ref=e72]:
          - heading "Deterministic Metrics" [level=3] [ref=e73]
          - paragraph [ref=e74]: Recall@K, Precision@K, Hit@K, and IoU computed with exact character overlap math. No LLM judges.
        - generic [ref=e75]:
          - heading "Baseline vs Candidate" [level=3] [ref=e76]
          - paragraph [ref=e77]: Compare two retriever runs to measure which queries improved, regressed, or stayed the same.
        - generic [ref=e78]:
          - heading "CI Integration" [level=3] [ref=e79]
          - paragraph [ref=e80]: Automated exit codes and summary reports for pytest and GitHub Actions pipelines.
    - generic [ref=e82]:
      - heading "The problem" [level=2] [ref=e83]
      - paragraph [ref=e84]: "RAG pipeline changes can silently alter which evidence is retrieved. Any of the following can change retrieval behavior without obvious indication:"
      - list [ref=e85]:
        - listitem [ref=e86]: Chunk size or overlap
        - listitem [ref=e88]: Embedding model version
        - listitem [ref=e90]: Retriever algorithm
        - listitem [ref=e92]: Vector database upgrade
        - listitem [ref=e94]: Reranking strategy
        - listitem [ref=e96]: Document updates
      - paragraph [ref=e98]: Without regression tests, you only discover these changes when your application produces wrong answers. SPANCHOR makes retrieval changes testable before they reach production.
