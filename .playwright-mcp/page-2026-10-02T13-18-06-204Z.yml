                - generic [ref=f4e166]:
                  - heading "SPANCHOR Does" [level=3] [ref=f4e171]
                  - list [ref=f4e172]:
                    - listitem [ref=f4e173]: ✓ Evaluate retrieval accuracy against source-anchored ground truth
                    - listitem [ref=f4e174]: ✓ Compare baseline vs candidate performance automatically
                    - listitem [ref=f4e175]: ✓ Detect query-level regressions
                    - listitem [ref=f4e176]: ✓ Run in CI/CD pipelines (pytest, GitHub Actions, etc.)
                    - listitem [ref=f4e177]: ✓ Work with any retriever (BM25, vectors, hybrid, etc.)
                    - listitem [ref=f4e178]: ✓ Remain stable when you change chunking strategies
