          - paragraph [ref=f4e83]: Source-anchored regression testing for RAG retrieval pipelines. v0.3.0
        - article [ref=f4e84]:
          - generic [ref=f4e85]:
            - generic [ref=f4e86]:
              - heading "What is SPANCHOR?" [level=2] [ref=f4e87]
              - generic [ref=f4e88]:
                - paragraph [ref=f4e89]:
                  - strong [ref=f4e90]: SPANCHOR
                  - text: is an open-source Python library for regression testing RAG (Retrieval-Augmented Generation) retrieval pipelines.
                - paragraph [ref=f4e91]:
                  - text: It evaluates retrieved evidence against
                  - strong [ref=f4e92]: source-anchored ground truth
                  - text: — character offsets with SHA-256 hashes tied to exact spans in your source documents. When your retrieval pipeline changes, SPANCHOR detects query-level regressions automatically.
                - paragraph [ref=f4e93]:
                  - text: SPANCHOR is
                  - strong [ref=f4e94]: local-first
                  - text: ","
                  - strong [ref=f4e95]: deterministic
                  - text: ", and designed to run in CI pipelines. It requires no LLM judge, hosted service, or internet connection."
            - generic [ref=f4e96]:
              - heading "What problem does it solve?" [level=2] [ref=f4e97]
              - generic [ref=f4e98]:
                - paragraph [ref=f4e99]: Retrieval systems are fragile. A small change to your embedding model, BM25 params, or chunking strategy can silently break your RAG application.
                - list [ref=f4e100]:
                  - listitem [ref=f4e101]:
                    - strong [ref=f4e102]: You ship a retriever change, and nobody notices a query is now broken.
                  - listitem [ref=f4e103]:
                    - strong [ref=f4e104]: You increase chunk size and metrics drop, but Recall@5 looks stable.
                  - listitem [ref=f4e105]:
                    - strong [ref=f4e106]: You can't compare candidates fairly without running expensive human evaluation.
                - paragraph [ref=f4e107]:
                  - text: SPANCHOR gives you
                  - strong [ref=f4e108]: automated, reproducible ground truth evaluation
                  - text: in your CI pipeline. Before you deploy, you know exactly which queries regressed and by how much.
            - generic [ref=f4e109]:
              - heading "Where does it sit in a RAG pipeline?" [level=2] [ref=f4e110]
              - generic [ref=f4e111]: Source Documents ↓ Canonicalization ↓ Chunking ↓ Retrieval ← Your system under test ↓ SPANCHOR ← Evaluation happens here ↓ Metrics & Regression Detection ↓ CI / CD Gate
              - paragraph [ref=f4e113]:
                - text: SPANCHOR sits
                - strong [ref=f4e114]: after
                - text: retrieval and
                - strong [ref=f4e115]: before
                - text: your CI gate. You give it your retrieval results and a gold set of source-anchored ground truth, and it tells you if performance regressed.
            - generic [ref=f4e116]:
              - heading "How it works" [level=2] [ref=f4e117]
              - generic [ref=f4e118]:
                - generic [ref=f4e119]:
                  - heading "1. Source Anchors" [level=3] [ref=f4e120]
                  - paragraph [ref=f4e121]: "You annotate your documents with ground-truth evidence spans: exact character offsets + SHA-256 hashes. These are stable across chunking changes."
                - generic [ref=f4e122]:
                  - heading "2. Gold Sets" [level=3] [ref=f4e123]
                  - paragraph [ref=f4e124]: Queries are linked to one or more source anchors, forming a "gold set" — your ground truth test data.
                - generic [ref=f4e125]:
                  - heading "3. Evaluation" [level=3] [ref=f4e126]
                  - paragraph [ref=f4e127]: SPANCHOR runs your gold set queries against your candidate retriever, comparing retrieved spans to ground-truth anchors using exact character overlap (IoU).
                - generic [ref=f4e128]:
                  - heading "4. Metrics & Comparison" [level=3] [ref=f4e129]
                  - paragraph [ref=f4e130]: Calculates Recall@K, Hit@K, Precision@K, and compares against your baseline. Identifies which specific queries regressed.
            - generic [ref=f4e131]:
              - heading "Installation" [level=2] [ref=f4e132]
              - code [ref=f4e134]: pip install spanchor
              - paragraph [ref=f4e135]:
                - text: Requires Python 3.11 or later. See the
                - link "Installation guide" [ref=f4e136] [cursor=pointer]:
                  - /url: /docs/installation
                - text: for full requirements.
            - generic [ref=f4e137]:
              - heading "Quick example" [level=2] [ref=f4e138]
              - code [ref=f4e140]: "from spanchor import evaluate, GoldSet # Load source-anchored ground truth gold_set = GoldSet.from_json(\"gold_set.json\") # Evaluate candidate retrieval results result = evaluate( gold_set=gold_set, retrieved_results=\"candidate_output.json\", top_k=[1, 3, 5] ) # Print regression summary result.print_summary()"
              - paragraph [ref=f4e141]:
                - text: See the
                - link "Quickstart tutorial" [ref=f4e142] [cursor=pointer]:
                  - /url: /docs/quickstart
                - text: for a complete walkthrough.
            - generic [ref=f4e143]:
              - heading "What it evaluates" [level=2] [ref=f4e144]
              - generic [ref=f4e145]:
                - paragraph [ref=f4e146]: "Metrics computed per query:"
                - list [ref=f4e147]:
                  - listitem [ref=f4e148]:
                    - strong [ref=f4e149]: Recall@K
                    - text: — fraction of gold anchor text found in top K results
                  - listitem [ref=f4e150]:
                    - strong [ref=f4e151]: Hit@K
                    - text: "— binary: did we find any gold anchor in top K?"
                  - listitem [ref=f4e152]:
                    - strong [ref=f4e153]: Precision@K
                    - text: — fraction of retrieved content that's relevant
                  - listitem [ref=f4e154]:
                    - strong [ref=f4e155]: IoU
                    - text: — intersection over union of retrieved vs gold character spans
                  - listitem [ref=f4e156]:
                    - strong [ref=f4e157]: Regression Delta
                    - text: — metric difference vs baseline
                - paragraph [ref=f4e158]: "Aggregate output:"
                - list [ref=f4e159]:
                  - listitem [ref=f4e160]: "Query counts: Improved, Unchanged, Regressed"
                  - listitem [ref=f4e161]: Per-query delta ranking
                  - listitem [ref=f4e162]: CI-friendly exit codes for regression thresholds
