      - heading "What SPANCHOR does" [level=2] [ref=f3e68]
      - paragraph [ref=f3e69]:
        - text: "SPANCHOR evaluates retrieved evidence against source-anchored ground truth and compares retrieval runs to detect query-level regressions. It gives you a deterministic, math-based answer to the question:"
        - emphasis [ref=f3e70]: "\"Is my retrieval pipeline still finding the right content?\""
      - generic [ref=f3e71]:
        - generic [ref=f3e72]:
          - heading "Source Anchors" [level=3] [ref=f3e73]
          - paragraph [ref=f3e74]: Ground truth tied directly to character offsets in source documents — stable across chunking changes.
        - generic [ref=f3e75]:
          - heading "Deterministic Metrics" [level=3] [ref=f3e76]
          - paragraph [ref=f3e77]: Recall@K, Precision@K, Hit@K, and IoU computed with exact character overlap math. No LLM judges.
        - generic [ref=f3e78]:
          - heading "Baseline vs Candidate" [level=3] [ref=f3e79]
          - paragraph [ref=f3e80]: Compare two retriever runs to measure which queries improved, regressed, or stayed the same.
        - generic [ref=f3e81]:
          - heading "CI Integration" [level=3] [ref=f3e82]
          - paragraph [ref=f3e83]: Automated exit codes and summary reports for pytest and GitHub Actions pipelines.
    - generic [ref=f3e85]:
      - heading "The problem" [level=2] [ref=f3e86]
      - paragraph [ref=f3e87]: "RAG pipeline changes can silently alter which evidence is retrieved. Any of the following can change retrieval behavior without obvious indication:"
      - list [ref=f3e88]:
        - listitem [ref=f3e89]: Chunk size or overlap
        - listitem [ref=f3e91]: Embedding model version
        - listitem [ref=f3e93]: Retriever algorithm
        - listitem [ref=f3e95]: Vector database upgrade
        - listitem [ref=f3e97]: Reranking strategy
        - listitem [ref=f3e99]: Document updates
      - paragraph [ref=f3e101]: Without regression tests, you only discover these changes when your application produces wrong answers. SPANCHOR makes retrieval changes testable before they reach production.
