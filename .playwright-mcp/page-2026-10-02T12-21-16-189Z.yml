        - generic [ref=f4e81]:
          - heading "SPANCHOR Documentation" [level=1] [ref=f4e82]
          - paragraph [ref=f4e83]: Source-anchored regression testing for RAG retrieval pipelines. v0.3.0
        - article [ref=f4e84]:
          - generic [ref=f4e85]:
            - generic [ref=f4e86]:
              - heading "Overview" [level=2] [ref=f4e87]
              - paragraph [ref=f4e88]: SPANCHOR is an open-source Python library for regression testing RAG retrieval pipelines. It evaluates retrieved evidence against source-anchored ground truth and detects query-level regressions when your retrieval pipeline changes.
              - paragraph [ref=f4e89]:
                - text: SPANCHOR is
                - strong [ref=f4e90]: local-first
                - text: ","
                - strong [ref=f4e91]: deterministic
                - text: ", and designed to run in CI pipelines. It does not require an internet connection, LLM judge, or hosted service."
            - generic [ref=f4e92]:
              - heading "Installation" [level=2] [ref=f4e93]
              - code [ref=f4e95]: pip install spanchor
              - paragraph [ref=f4e96]:
                - text: Requires Python 3.11 or later. See the
                - link "Installation guide" [ref=f4e97] [cursor=pointer]:
                  - /url: /docs/installation
                - text: for full requirements.
            - generic [ref=f4e98]:
              - heading "Quick start" [level=2] [ref=f4e99]
              - code [ref=f4e101]: "from spanchor import evaluate, GoldSet # Load source-anchored ground truth gold_set = GoldSet.from_json(\"gold_set.json\") # Evaluate candidate retrieval results result = evaluate( gold_set=gold_set, retrieved_results=\"candidate_output.json\", top_k=[1, 3, 5] ) # Print regression summary result.print_summary()"
              - paragraph [ref=f4e102]:
                - text: See the
                - link "Quickstart tutorial" [ref=f4e103] [cursor=pointer]:
                  - /url: /docs/quickstart
                - text: for a complete walkthrough.
            - generic [ref=f4e104]:
              - heading "Core concepts" [level=2] [ref=f4e105]
              - heading "Document" [level=3] [ref=f4e106]
              - paragraph [ref=f4e107]: A raw source text file after canonicalization. SPANCHOR works on character offsets within canonicalized documents so that anchors remain stable across chunking strategy changes.
              - heading "DocumentSpan" [level=3] [ref=f4e108]
              - paragraph [ref=f4e109]: A contiguous span of characters within a canonicalized document, identified by start offset, end offset, and document identifier.
              - heading "SourceAnchor" [level=3] [ref=f4e110]
              - paragraph [ref=f4e111]:
                - text: The ground-truth evidence span for a given query. A SourceAnchor is tied to a specific
                - code [ref=f4e112]: DocumentSpan
                - text: and stored with a SHA-256 hash for integrity verification. Because anchors reference character positions rather than chunk IDs, they remain valid when chunking parameters change.
              - heading "GoldSet" [level=3] [ref=f4e113]
              - paragraph [ref=f4e114]:
                - text: A collection of queries, each annotated with one or more
                - code [ref=f4e115]: SourceAnchor
                - text: objects that represent the correct retrievable evidence. Gold sets are stored as JSON and loaded via
                - code [ref=f4e116]: GoldSet.from_json()
                - text: .
              - heading "RetrievalResult" [level=3] [ref=f4e117]
              - paragraph [ref=f4e118]: The output of your retriever for a single query. Contains the list of chunks returned by your retrieval system, in rank order.
              - heading "EvaluationResult" [level=3] [ref=f4e119]
              - paragraph [ref=f4e120]:
                - text: The output of
                - code [ref=f4e121]: evaluate()
                - text: . Contains per-query metric scores and a regression status for each query in the gold set.
              - heading "ComparisonResult" [level=3] [ref=f4e122]
              - paragraph [ref=f4e123]:
                - text: The output of
                - code [ref=f4e124]: compare()
                - text: ". Contains aggregate regression statistics: improved, unchanged, and regressed query counts, and per-query delta values."
            - generic [ref=f4e125]:
              - heading "Metrics" [level=2] [ref=f4e126]
              - paragraph [ref=f4e127]: "SPANCHOR computes the following metrics using exact character span overlap:"
              - list [ref=f4e128]:
                - listitem [ref=f4e129]:
                  - strong [ref=f4e130]: Recall@K
                  - text: — fraction of gold anchor text captured in top K chunks
                - listitem [ref=f4e131]:
                  - strong [ref=f4e132]: Hit@K
                  - text: "— binary: did at least one gold anchor appear in top K chunks?"
                - listitem [ref=f4e133]:
                  - strong [ref=f4e134]: Precision@K
                  - text: — fraction of retrieved context that overlaps gold anchors
                - listitem [ref=f4e135]:
                  - strong [ref=f4e136]: IoU
                  - text: — intersection over union of retrieved and gold character spans
                - listitem [ref=f4e137]:
                  - strong [ref=f4e138]: Regression delta
                  - text: — metric difference between baseline and candidate
              - paragraph [ref=f4e139]:
                - text: See the
                - link "Metrics reference" [ref=f4e140] [cursor=pointer]:
                  - /url: /docs/metrics
                - text: for formulas.
            - generic [ref=f4e141]:
              - heading "Integrations" [level=2] [ref=f4e142]
              - paragraph [ref=f4e143]:
                - text: SPANCHOR ships with retriever adapters for common frameworks. See the
                - link "Adapters page" [ref=f4e144] [cursor=pointer]:
                  - /url: /docs/adapters
                - text: .
              - list [ref=f4e145]:
                - listitem [ref=f4e146]:
                  - strong [ref=f4e147]: Generic
                  - text: — works with any retriever that returns a list of text chunks
                - listitem [ref=f4e148]:
                  - strong [ref=f4e149]: LangChain
                  - text: — adapter for LangChain retrievers
                - listitem [ref=f4e150]:
                  - strong [ref=f4e151]: LlamaIndex
                  - text: — adapter for LlamaIndex query engines
            - generic [ref=f4e152]:
              - heading "CLI" [level=2] [ref=f4e153]
              - paragraph [ref=f4e154]:
                - text: SPANCHOR includes a command-line interface for running evaluations and comparisons without writing Python code. See the
                - link "CLI reference" [ref=f4e155] [cursor=pointer]:
                  - /url: /docs/cli
                - text: .
              - code [ref=f4e157]: "# Validate a gold set file spanchor validate gold_set.json # Evaluate retrieval results spanchor evaluate --gold-set gold_set.json --candidate results.json # Compare baseline and candidate spanchor compare baseline.json candidate.json"
            - generic [ref=f4e158]:
              - heading "CI usage" [level=2] [ref=f4e159]
              - paragraph [ref=f4e160]: SPANCHOR returns non-zero exit codes when regressions exceed a configurable threshold, making it easy to integrate into GitHub Actions, GitLab CI, or any CI system.
              - code [ref=f4e162]: "# pytest integration import pytest from spanchor import evaluate, GoldSet def test_retrieval_no_regression(): gold_set = GoldSet.from_json(\"gold_set.json\") result = evaluate(gold_set=gold_set, retrieved_results=\"output.json\") assert result.regression_count == 0, result.summary()"
