                - text: for a complete walkthrough.
            - generic [ref=f1e143]:
              - heading "What it evaluates" [level=2] [ref=f1e144]
              - generic [ref=f1e145]:
                - paragraph [ref=f1e146]: "Metrics computed per query:"
                - list [ref=f1e147]:
                  - listitem [ref=f1e148]:
                    - strong [ref=f1e149]: Recall@K
                    - text: — fraction of gold anchor text found in top K results
                  - listitem [ref=f1e150]:
                    - strong [ref=f1e151]: Hit@K
                    - text: "— binary: did we find any gold anchor in top K?"
                  - listitem [ref=f1e152]:
                    - strong [ref=f1e153]: Precision@K
                    - text: — fraction of retrieved content that's relevant
                  - listitem [ref=f1e154]:
                    - strong [ref=f1e155]: IoU
                    - text: — intersection over union of retrieved vs gold character spans
                  - listitem [ref=f1e156]:
                    - strong [ref=f1e157]: Regression Delta
                    - text: — metric difference vs baseline
                - paragraph [ref=f1e158]: "Aggregate output:"
                - list [ref=f1e159]:
                  - listitem [ref=f1e160]: "Query counts: Improved, Unchanged, Regressed"
                  - listitem [ref=f1e161]: Per-query delta ranking
