        - article [ref=f1e84]:
          - generic [ref=f1e85]:
            - generic [ref=f1e86]:
              - heading "What is SPANCHOR?" [level=2] [ref=f1e87]
              - generic [ref=f1e88]:
                - paragraph [ref=f1e89]:
                  - strong [ref=f1e90]: SPANCHOR
                  - text: is an open-source Python library for regression testing RAG (Retrieval-Augmented Generation) retrieval pipelines.
                - paragraph [ref=f1e91]:
                  - text: It evaluates retrieved evidence against
                  - strong [ref=f1e92]: source-anchored ground truth
                  - text: — character offsets with SHA-256 hashes tied to exact spans in your source documents. When your retrieval pipeline changes, SPANCHOR detects query-level regressions automatically.
                - paragraph [ref=f1e93]:
                  - text: SPANCHOR is
                  - strong [ref=f1e94]: local-first
                  - text: ","
                  - strong [ref=f1e95]: deterministic
                  - text: ", and designed to run in CI pipelines. It requires no LLM judge, hosted service, or internet connection."
            - generic [ref=f1e96]:
              - heading "What problem does it solve?" [level=2] [ref=f1e97]
              - generic [ref=f1e98]:
                - paragraph [ref=f1e99]: Retrieval systems are fragile. A small change to your embedding model, BM25 params, or chunking strategy can silently break your RAG application.
                - list [ref=f1e100]:
                  - listitem [ref=f1e101]:
                    - strong [ref=f1e102]: You ship a retriever change, and nobody notices a query is now broken.
                  - listitem [ref=f1e103]:
                    - strong [ref=f1e104]: You increase chunk size and metrics drop, but Recall@5 looks stable.
                  - listitem [ref=f1e105]:
                    - strong [ref=f1e106]: You can't compare candidates fairly without running expensive human evaluation.
                - paragraph [ref=f1e107]:
                  - text: SPANCHOR gives you
                  - strong [ref=f1e108]: automated, reproducible ground truth evaluation
                  - text: in your CI pipeline. Before you deploy, you know exactly which queries regressed and by how much.
            - generic [ref=f1e109]:
              - heading "Where does it sit in a RAG pipeline?" [level=2] [ref=f1e110]
              - generic [ref=f1e111]: Source Documents ↓ Canonicalization ↓ Chunking ↓ Retrieval ← Your system under test ↓ SPANCHOR ← Evaluation happens here ↓ Metrics & Regression Detection ↓ CI / CD Gate
              - paragraph [ref=f1e113]:
                - text: SPANCHOR sits
                - strong [ref=f1e114]: after
                - text: retrieval and
                - strong [ref=f1e115]: before
                - text: your CI gate. You give it your retrieval results and a gold set of source-anchored ground truth, and it tells you if performance regressed.
            - generic [ref=f1e116]:
              - heading "How it works" [level=2] [ref=f1e117]
              - generic [ref=f1e118]:
                - generic [ref=f1e119]:
                  - heading "1. Source Anchors" [level=3] [ref=f1e120]
                  - paragraph [ref=f1e121]: "You annotate your documents with ground-truth evidence spans: exact character offsets + SHA-256 hashes. These are stable across chunking changes."
                - generic [ref=f1e122]:
                  - heading "2. Gold Sets" [level=3] [ref=f1e123]
                  - paragraph [ref=f1e124]: Queries are linked to one or more source anchors, forming a "gold set" — your ground truth test data.
                - generic [ref=f1e125]:
                  - heading "3. Evaluation" [level=3] [ref=f1e126]
                  - paragraph [ref=f1e127]: SPANCHOR runs your gold set queries against your candidate retriever, comparing retrieved spans to ground-truth anchors using exact character overlap (IoU).
                - generic [ref=f1e128]:
                  - heading "4. Metrics & Comparison" [level=3] [ref=f1e129]
                  - paragraph [ref=f1e130]: Calculates Recall@K, Hit@K, Precision@K, and compares against your baseline. Identifies which specific queries regressed.
            - generic [ref=f1e131]:
              - heading "Installation" [level=2] [ref=f1e132]
              - code [ref=f1e134]: pip install spanchor
              - paragraph [ref=f1e135]:
                - text: Requires Python 3.11 or later. See the
                - link "Installation guide" [ref=f1e136] [cursor=pointer]:
