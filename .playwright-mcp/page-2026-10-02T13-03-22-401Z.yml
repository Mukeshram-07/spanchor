                - text: for full requirements.
            - generic [ref=f1e137]:
              - heading "Quick example" [level=2] [ref=f1e138]
              - code [ref=f1e140]: "from spanchor import evaluate, GoldSet # Load source-anchored ground truth gold_set = GoldSet.from_json(\"gold_set.json\") # Evaluate candidate retrieval results result = evaluate( gold_set=gold_set, retrieved_results=\"candidate_output.json\", top_k=[1, 3, 5] ) # Print regression summary result.print_summary()"
              - paragraph [ref=f1e141]:
                - text: See the
                - link "Quickstart tutorial" [ref=f1e142] [cursor=pointer]:
