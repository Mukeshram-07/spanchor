                - generic [ref=f1e166]:
                  - heading "SPANCHOR Does" [level=3] [ref=f1e171]
                  - list [ref=f1e172]:
                    - listitem [ref=f1e173]: ✓ Evaluate retrieval accuracy against source-anchored ground truth
                    - listitem [ref=f1e174]: ✓ Compare baseline vs candidate performance automatically
                    - listitem [ref=f1e175]: ✓ Detect query-level regressions
                    - listitem [ref=f1e176]: ✓ Run in CI/CD pipelines (pytest, GitHub Actions, etc.)
                    - listitem [ref=f1e177]: ✓ Work with any retriever (BM25, vectors, hybrid, etc.)
                    - listitem [ref=f1e178]: ✓ Remain stable when you change chunking strategies
