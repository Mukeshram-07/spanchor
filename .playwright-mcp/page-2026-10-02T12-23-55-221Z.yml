    - generic [ref=f9e67]:
      - heading "What SPANCHOR does" [level=2] [ref=f9e68]
      - paragraph [ref=f9e69]:
        - text: "SPANCHOR evaluates retrieved evidence against source-anchored ground truth and compares retrieval runs to detect query-level regressions. It gives you a deterministic, math-based answer to the question:"
        - emphasis [ref=f9e70]: "\"Is my retrieval pipeline still finding the right content?\""
      - generic [ref=f9e71]:
        - generic [ref=f9e72]:
          - heading "Source Anchors" [level=3] [ref=f9e73]
          - paragraph [ref=f9e74]: Ground truth tied directly to character offsets in source documents — stable across chunking changes.
        - generic [ref=f9e75]:
          - heading "Deterministic Metrics" [level=3] [ref=f9e76]
          - paragraph [ref=f9e77]: Recall@K, Precision@K, Hit@K, and IoU computed with exact character overlap math. No LLM judges.
        - generic [ref=f9e78]:
          - heading "Baseline vs Candidate" [level=3] [ref=f9e79]
          - paragraph [ref=f9e80]: Compare two retriever runs to measure which queries improved, regressed, or stayed the same.
        - generic [ref=f9e81]:
          - heading "CI Integration" [level=3] [ref=f9e82]
          - paragraph [ref=f9e83]: Automated exit codes and summary reports for pytest and GitHub Actions pipelines.
    - generic [ref=f9e85]:
      - heading "The problem" [level=2] [ref=f9e86]
      - paragraph [ref=f9e87]: "RAG pipeline changes can silently alter which evidence is retrieved. Any of the following can change retrieval behavior without obvious indication:"
      - list [ref=f9e88]:
        - listitem [ref=f9e89]: Chunk size or overlap
        - listitem [ref=f9e91]: Embedding model version
        - listitem [ref=f9e93]: Retriever algorithm
        - listitem [ref=f9e95]: Vector database upgrade
        - listitem [ref=f9e97]: Reranking strategy
        - listitem [ref=f9e99]: Document updates
      - paragraph [ref=f9e101]: Without regression tests, you only discover these changes when your application produces wrong answers. SPANCHOR makes retrieval changes testable before they reach production.
